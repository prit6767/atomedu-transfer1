name: Build and publish index.html

on:
  push:
    branches: [main]
    paths:
      - "src/index.template.html"
      - "src/logo-light-sm.b64"
      - "src/logo-dark-sm.b64"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build index.html
        run: python3 build.py

      - name: Commit regenerated index.html (if changed)
        run: |
          git config user.name  "atom-edu-bot"
          git config user.email "bot@atom-edu.org"
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git add index.html
            git commit -m "build: regenerate index.html"
            git push
          else
            echo "index.html unchanged; nothing to commit."
          fi
