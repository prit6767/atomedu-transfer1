name = "atom-edu"
main = "src/worker.js"
compatibility_date = "2025-08-01"
workers_dev = true

# Public vars (safe to commit). Secrets live in `wrangler secret put` — never here.
[vars]
ALLOWED_ORIGIN = "https://atom-edu.org,https://www.atom-edu.org"
GOOGLE_CLIENT_ID = "550124493800-3h3411am4rsra5msc3qino23inbfb522.apps.googleusercontent.com"
WORKER_URL     = "https://atom-edu.pritamavuthu7.workers.dev"
SITE_URL       = "https://atom-edu.org"
GOOGLE_DEBUG_TOKEN = "atomdbg-9f3c17a2b4e8"
GROQ_ENDPOINT  = "https://api.groq.com/openai/v1/chat/completions"
DAILY_CAP      = "5"
TEXT_DAILY_CAP = "15"
SLIDES_MONTHLY_CAP = "3"
GLOBAL_DAILY_CAP = "500"
GLOBAL_SLIDES_DAILY_CAP = "30"
IP_DAILY_CAP   = "150"

# Optional: KV namespace for server-side daily-cap tracking.
# Create with:  wrangler kv:namespace create RATE_KV
